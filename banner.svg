<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Alpesh Ranjan. Payments, blockchain and product. New York." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1040" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- settlement network: rails converging on one node -->
  <g fill="none" stroke-linecap="round">
    <path d="M760 70 C 880 70, 900 150, 1040 150" stroke="#4f8cff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M760 110 C 870 110, 910 150, 1040 150" stroke="#4f8cff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M760 150 L 1040 150" stroke="url(#rail)" stroke-width="3"/>
    <path d="M760 190 C 870 190, 910 150, 1040 150" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M760 230 C 880 230, 900 150, 1040 150" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b9bc4" text-anchor="end">
    <text x="748" y="74">ACH</text>
    <text x="748" y="114">Fedwire</text>
    <text x="748" y="154">RTP</text>
    <text x="748" y="194">FedNow</text>
    <text x="748" y="234">USDC</text>
  </g>
  <g fill="#0b1020" stroke-width="2">
    <circle cx="760" cy="70" r="5" stroke="#4f8cff"/>
    <circle cx="760" cy="110" r="5" stroke="#4f8cff"/>
    <circle cx="760" cy="150" r="5" stroke="#6aa7ff"/>
    <circle cx="760" cy="190" r="5" stroke="#2dd4bf"/>
    <circle cx="760" cy="230" r="5" stroke="#2dd4bf"/>
  </g>
  <circle cx="1040" cy="150" r="22" fill="#2dd4bf" fill-opacity="0.12"/>
  <circle cx="1040" cy="150" r="10" fill="url(#accent)"/>
  <text x="1040" y="196" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b9bc4" text-anchor="middle">settled</text>

  <!-- name block -->
  <rect x="64" y="78" width="44" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f4f6fb" letter-spacing="-1">Alpesh Ranjan</text>
  <text x="64" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c3cce3">Payments · Blockchain · Product and engineering</text>
  <text x="64" y="226" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7f8db3">New York · ex-Oracle Financial Services</text>
</svg>
