<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="$0.005 USDC per SettleQuote call. AML view rebuild cut from 4.3 seconds to 109 milliseconds. 203,769 Bitcoin transactions modeled. 21.0% of Gemini reviews were 1 to 2 stars against 8.6% for ChatGPT." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="40" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(0,0)">
      <rect width="288" height="150" rx="12" fill="url(#bg)" stroke="#24304f"/>
      <rect x="24" y="24" width="40" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="24" y="78" font-size="36" font-weight="700" fill="#f4f6fb">$0.005</text>
      <text x="24" y="106" font-size="15" fill="#c3cce3">USDC per SettleQuote call,</text>
      <text x="24" y="126" font-size="15" fill="#c3cce3">paid by agents over x402</text>
    </g>
    <g transform="translate(304,0)">
      <rect width="288" height="150" rx="12" fill="url(#bg)" stroke="#24304f"/>
      <rect x="24" y="24" width="40" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="24" y="78" font-size="32" font-weight="700" fill="#f4f6fb">4.3 s <tspan fill="#2dd4bf">→</tspan> 109 ms</text>
      <text x="24" y="106" font-size="15" fill="#c3cce3">AML alert-view rebuild after</text>
      <text x="24" y="126" font-size="15" fill="#c3cce3">range partitioning</text>
    </g>
    <g transform="translate(608,0)">
      <rect width="288" height="150" rx="12" fill="url(#bg)" stroke="#24304f"/>
      <rect x="24" y="24" width="40" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="24" y="78" font-size="36" font-weight="700" fill="#f4f6fb">203,769</text>
      <text x="24" y="106" font-size="15" fill="#c3cce3">Bitcoin transactions loaded</text>
      <text x="24" y="126" font-size="15" fill="#c3cce3">for AML monitoring</text>
    </g>
    <g transform="translate(912,0)">
      <rect width="288" height="150" rx="12" fill="url(#bg)" stroke="#24304f"/>
      <rect x="24" y="24" width="40" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="24" y="78" font-size="36" font-weight="700" fill="#f4f6fb">21.0% <tspan font-size="20" font-weight="400" fill="#8b9bc4">vs</tspan> 8.6%</text>
      <text x="24" y="106" font-size="15" fill="#c3cce3">1–2 star reviews, Gemini vs</text>
      <text x="24" y="126" font-size="15" fill="#c3cce3">ChatGPT (20,000 reviews)</text>
    </g>
  </g>
</svg>
